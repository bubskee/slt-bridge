# slt-bridge zoo: certified SLT examples restated in the shared core's vocabulary.
# Kept as a separate package so that the core (`..`) stays mathlib-only.
name = "slt-zoo"
version = "0.0.1"
defaultTargets = ["Zoo"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "slt-bridge"
path = ".."

# Scalar ResNet paper, pinned at the paper's reproducibility snapshot (Lean source unchanged since 3aa8739).
[[require]]
name = "residual-slt"
git = "https://github.com/bubskee/residual-slt-in-a-haystack.git"
rev = "2865e70a9ca7f559dabfce6aa32e13cf4fc88259"
subDir = "lean"

[[lean_lib]]
name = "Zoo"

# Vector cubic-ResNet paper (local repository, no remote yet), pinned at the namespace-rename commit.
[[require]]
name = "VectorSLT"
git = "/Users/bubskee/workspace/vector-slt-lean"
rev = "2d545cdcb9f20c34bcb188ee496d6c0261fb7289"
