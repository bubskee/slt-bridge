# slt-bridge zoo: certified SLT examples restated in the shared core's vocabulary.
# Kept as a separate package so that the core (`..`) stays mathlib-only.
name = "slt-zoo"
version = "0.0.1"
defaultTargets = ["Zoo"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
# Mathlib's standard linter set (brief 02, C1). The header linter is off: it enforces Mathlib's own
# "Authors:" header layout, and the copyright lines here are kept as they are.
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "slt-bridge"
path = ".."

# Scalar ResNet paper, pinned at the paper's reproducibility snapshot (Lean source unchanged since 3aa8739).
[[require]]
name = "residual-slt"
git = "https://github.com/bubskee/residual-slt-in-a-haystack.git"
rev = "2865e70a9ca7f559dabfce6aa32e13cf4fc88259"
subDir = "lean"

[[lean_lib]]
name = "Zoo"

# Vector cubic-ResNet paper, pinned at the commit that adds `VectorSLT/LossCompare`.
[[require]]
name = "VectorSLT"
git = "https://github.com/bubskee/vector-slt-lean.git"
rev = "196b8df2fd0623fc7d61e8694aaede9643eaf943"
